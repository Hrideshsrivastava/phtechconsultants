<body>
  <div id="root"></div>
  <script>
    // Pre-rendered pages carry the path they were built for. When the server falls back to this file for
    // another route (e.g. the LMS), drop the stale markup so it doesn't flash before the app loads.
    (function () {
      var root = document.getElementById('root');
      var built = root.getAttribute('data-prerendered');
      var path = location.pathname.replace(/\/+$/, '') || '/';
      if (built && built !== path) root.innerHTML = '';
    })();
  </script>

</body>
